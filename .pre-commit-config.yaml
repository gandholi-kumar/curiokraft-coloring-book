# Pre-commit configuration for CurioKraft Coloring Book Engine
# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic
          - types-PyYAML
          - types-requests

  # Local hook: block accidental commit of sensitive KDP forms/credentials
  - repo: local
    hooks:
      - id: sensitive-file-guard
        name: Block sensitive files (KDP forms, credentials, API keys)
        entry: bash scripts/check_sensitive_files.sh
        language: system
        types: [text]