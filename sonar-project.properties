# SonarCloud Project Configuration for CurioKraft Coloring Book Engine
sonar.projectKey=curiokraft-coloring-book
sonar.organization=curiokraft
sonar.projectName=CurioKraft Coloring Book Engine
sonar.projectVersion=1.0.0

# Source and Test directories
sonar.sources=src
sonar.tests=tests

# Encoding and Language
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14

# Test Coverage and Execution Reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions
sonar.exclusions=assets/**, output/**, generated/**, logs/**, scratch/**, docs/**, manifest/**, private_docs/**
