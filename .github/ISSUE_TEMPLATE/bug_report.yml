name: 🐛 Bug Report / Preflight Failure
description: File an issue about a validator failure, rendering defect, or engine bug.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thanks for reporting an issue in the CurioKraft Publishing Engine!
        Please fill in as much detail as possible to help reproduce and resolve the problem.
  - type: dropdown
    id: component
    attributes:
      label: Affected Engine Component
      options:
        - Interior Compositor (PDF / PNG)
        - Cover Compositor (Wrap / Spine / Barcode)
        - Margin / Grayscale Validator
        - KDP 18-Point Preflight Diagnostic
        - Multi-Agent Debate Engine / Prompts
        - CLI / Batch Runner
      default: 0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the CLI command or script executed.
      placeholder: |
        1. Run `curiokraft-book generate book`
        2. Run `curiokraft-book preflight run`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic Logs / Terminal Output
      description: Paste any error messages or preflight certificate outputs.
      render: shell
