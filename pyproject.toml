[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curiokraft-coloring-book"
version = "1.0.0"
description = "Multi-Agent AI & Deterministic Production Engine for Amazon KDP Coloring Books"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "CurioKraft Publications", email = "publishing@curiokraft.com" }
]
keywords = ["kdp", "coloring-book", "publishing", "multi-agent", "image-generation"]

dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "Pillow>=10.2.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "reportlab>=4.1.0",
    "pymupdf>=1.23.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.4.0",
    "google-genai>=0.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "pip-audit>=2.7.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.31.0"
]

[project.scripts]
curiokraft-book = "curiokraft_book.cli:app"
ck-publish = "curiokraft_book.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security checks)
]
ignore = ["E501", "B008", "S101", "S110", "S112", "S311", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"] # Allow asserts and mock credentials in tests

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
source = ["src/curiokraft_book"]
omit = ["tests/*", "src/curiokraft_book/cli.py"]

[tool.coverage.report]
show_missing = true
fail_under = 50

