# ---------------------------------------------------------------------------
# VEHICLE STRUCTURAL DOMAIN & DESIGN MATRIX (Authoritative Standard)
# ---------------------------------------------------------------------------
vehicle_domain_matrix:
  wheeled_four_wheel:
    domain_type: "land_wheeled_automotive"
    has_wheels: true
    wheel_count: 4
    default_support: "four chunky round rubber tires supporting a sturdy automotive chassis"
    default_orientation: "three-quarter side-front profile view displaying the complete vehicle body and wheels"
    safeguards: "Keep windows large, clean, and empty. Avoid complex engine details, exhaust smoke, or road lines."
    negative_tokens:
      - "tiny mechanical chains"
      - "complex engine parts"
      - "road"
      - "street"
      - "exhaust smoke"
      - "human driver"
      - "passengers"

  wheeled_two_wheel:
    domain_type: "land_cycle"
    has_wheels: true
    wheel_count: 2
    default_support: "two clearly separated circular wheels connected by a clean tubular frame"
    default_orientation: "side profile view clearly displaying both wheels and frame"
    safeguards: "Show exactly two wheels. Do not draw four wheels or car bodies. Keep frame clean without complex sprockets."
    negative_tokens:
      - "four wheels"
      - "car body"
      - "complex sprockets"
      - "tiny gear teeth"
      - "road"
      - "street"
      - "human rider"

  rail_vehicles:
    domain_type: "rail_transit"
    has_wheels: true
    wheel_count: "multiple_rail_wheels"
    default_support: "multiple round steel train wheels aligned neatly along the bottom baseline"
    default_orientation: "three-quarter side profile view displaying the locomotive cabin and wheels"
    safeguards: "Keep train wheels cleanly circular and aligned. Avoid heavy smoke, dirty soot, or complex drive rods."
    negative_tokens:
      - "rubber car tires"
      - "steering wheel"
      - "complex pistons"
      - "heavy dark smoke"
      - "road"
      - "street"

  rotorcraft:
    domain_type: "aerial_rotary"
    has_wheels: false
    wheel_count: 0
    default_support: "two horizontal parallel landing skids (runner rails) attached cleanly beneath the fuselage"
    default_orientation: "three-quarter side profile view displaying the cockpit bubble, top rotor, tail boom, and landing skids"
    safeguards: "Supported strictly by twin landing skids. Strictly DO NOT draw wheels, tires, car wheels, or landing gear wheels. Strictly DO NOT draw airplane wings."
    negative_tokens:
      - "wheels"
      - "tires"
      - "car wheels"
      - "bicycle wheels"
      - "landing gear wheels"
      - "airplane wings"
      - "jet engines"
      - "road"
      - "street"
      - "human pilot"

  spacecraft:
    domain_type: "space_propulsion"
    has_wheels: false
    wheel_count: 0
    default_support: "3 to 4 bold symmetrical stabilizing fins flared at the bottom base with a central rocket exhaust nozzle"
    default_orientation: "upright vertical or dynamic slight upward angle displaying the complete rocket fuselage and base fins"
    safeguards: "Supported strictly by aerodynamic base fins and rocket nozzle. Strictly DO NOT draw wheels, tires, road gear, landing tracks, or airplane wings."
    negative_tokens:
      - "wheels"
      - "tires"
      - "car wheels"
      - "bicycle wheels"
      - "road wheels"
      - "landing gear"
      - "road"
      - "street"
      - "tracks"
      - "ground"
      - "wings with propellers"
      - "astronaut face"

  watercraft:
    domain_type: "marine_surface"
    has_wheels: false
    wheel_count: 0
    default_support: "a smooth curved buoyant boat hull resting on a clean horizontal waterline"
    default_orientation: "three-quarter side profile view displaying the buoyant hull, deck, and sails or cabin"
    safeguards: "Supported strictly by a floating boat hull. Strictly DO NOT draw wheels, tires, automotive axles, or legs."
    negative_tokens:
      - "wheels"
      - "tires"
      - "car wheels"
      - "bicycle wheels"
      - "landing gear"
      - "road"
      - "pavement"
      - "street"
      - "tracks"
      - "legs"
      - "human captain"

  fixed_wing_aircraft:
    domain_type: "aerial_fixed_wing"
    has_wheels: false
    wheel_count: 0
    default_support: "aerodynamic flight stance with two wide symmetrical horizontal wings and clean minimal landing gear"
    default_orientation: "three-quarter front-side view displaying the full wingspan, fuselage, and tail fin"
    safeguards: "Wings must be smoothly attached to the cylindrical fuselage. Keep windows clean and colorable."
    negative_tokens:
      - "car wheels"
      - "bicycle wheels"
      - "road"
      - "street"
      - "complex mechanical engines"
      - "military weapons"
      - "passengers"
      - "human pilot"

  submersible:
    domain_type: "marine_underwater"
    has_wheels: false
    wheel_count: 0
