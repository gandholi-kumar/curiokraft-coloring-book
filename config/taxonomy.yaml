# ---------------------------------------------------------------------------
# OBJECT CATEGORY DETECTION
# Each category has:
#   keywords    — tokens that match canonical_object or section
#   section_hints — section-level strings that also match
#   visual_template — f-string with {readable} placeholder
# ---------------------------------------------------------------------------

categories:

  vehicles:
    keywords:
      - car
      - bus
      - truck
      - train
      - plane
      - airplane
      - boat
      - yacht
      - sailboat
      - bicycle
      - bike
      - motorcycle
      - scooter
      - taxi
      - ambulance
      - fire_truck
      - police_car
      - helicopter
      - rocket
      - tractor
      - wagon
    section_hints:
      - vehicle
      - transport
    visual_template: >-
      a cute classic {readable}, three-quarter side profile view displaying the complete
      vehicle body, large chunky round wheels, big clear colorable windows,
      and friendly preschool proportions

  paired_items:
    keywords:
      - shoes
      - socks
      - boots
      - gloves
      - mittens
      - maracas
      - chopsticks
      - slippers
      - earrings
      - flip_flops
    section_hints: []
    visual_template: >-
      a cute matching pair of toddler {readable} placed neatly side-by-side
      with wide open coloring surfaces

  # State-dependent items are resolved by the engine before category matching.
  # They are listed here for documentation and future extension.
  state_dependent:
    items:
      book:
        visual_template: >-
          a wide open toddler storybook with large clean blank colorable pages
          and a simple bookmark ribbon
      umbrella:
        visual_template: >-
          an open round canopy umbrella with distinct colorable stripe sections
          and a clean curved J-handle
      sunglasses:
        visual_template: >-
          a pair of cute toddler sunglasses, front view, round bold frames, and clean lenses
      glasses:
        visual_template: >-
          a pair of cute toddler sunglasses, front view, round bold frames, and clean lenses

  clothing:
    keywords:
      - shirt
      - pants
      - dress
      - jacket
      - coat
      - sweater
      - hat
      - cap
      - backpack
      - bag
      - scarf
