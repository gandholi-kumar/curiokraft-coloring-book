  clothing_accessories:
    category_name: "Clothing & Accessories"
    category_rule: >-
      Preserve the recognizable shape and basic construction of the clothing item or accessory.
      Avoid complex fabric textures, intricate patterns, excessive folds, and decorative micro-details.
    keywords:
      - shirt
      - pants
      - dress
      - socks
      - shoes
      - jacket
      - backpack
      - sunglasses
      - coat
      - sweater
      - hat
      - cap
      - bag
      - scarf
      - skirt
      - shorts
      - vest
      - apron
      - hoodie
      - raincoat
      - boots
      - mittens
      - gloves
    section_hints:
      - clothing
      - cloth
      - wear
      - fashion
      - apparel
      - accessory
    visual_template: >-
      a classic toddler {readable}, clean 2D flat-lay presentation with neat smooth seams, rounded contours, and large uncluttered coloring surfaces
    negative_tokens:
      - intricate fabric patterns
      - plaid
      - houndstooth
      - zipper micro-teeth
      - hanger
      - person wearing clothes
      - body

  household_daily_living:
    category_name: "Household & Daily Living"
    category_rule: >-
      Preserve the recognizable everyday form and essential functional characteristics of the household or daily-living object.
      Simplify buttons, controls, textures, and small components.
    keywords:
      - bed
      - chair
      - table
      - lamp
      - clock
      - toothbrush
      - comb
      - soap
      - towel
      - pillow
      - couch
      - sofa
      - bath
      - bathtub
      - toothpaste
      - brush
      - mirror
      - vase
      - kettle
      - pot
      - pan
      - mug
      - bowl
      - plate
      - fork
      - spoon
      - knife
      - scissors
      - broom
      - bucket
    section_hints:
      - household
      - house
      - home
      - furniture
      - kitchen
      - bathroom
      - daily
    visual_template: >-
      a classic toddler {readable}, clear three-quarter or frontal view displaying its iconic simplified physical structure, smooth clean surface, cozy preschool proportions, and wide open coloring areas
    negative_tokens:
      - room interior
      - floor
      - wall
      - wallpaper
      - electrical cords
      - plugs
      - tiny screws
      - face on object

  vehicles_transportation:
    category_name: "Vehicles & Transportation"
    category_rule: >-
      Preserve the recognizable overall structure and defining characteristics of the vehicle.
      Simplify mechanical components and avoid unnecessary technical details, while keeping the vehicle immediately identifiable.
    keywords:
      - car
      - bus
      - truck
      - bicycle
      - motorcycle
      - taxi
      - ambulance
      - fire_truck
      - police_car
      - helicopter
      - sailboat
      - rocket
      - train
      - plane
      - airplane
      - boat
      - yacht
      - scooter
      - tractor
      - wagon
    section_hints:
      - vehicle
      - transport
      - transportation
      - automobile
    visual_template: >-
      a cute classic {readable}, clear three-quarter or side profile view displaying the complete vehicle body, authentic support structure, big clear colorable panels, and friendly preschool proportions
    negative_tokens:
      - tiny mechanical chains
      - complex engine parts
      - road
      - street
      - background scenery
      - exhaust smoke
      - human driver

  nature_sky_garden:
    category_name: "Nature, Sky & Garden"
    category_rule: >-
      Represent the specified natural subject as a simple standalone form.
      Preserve its recognizable natural characteristics while avoiding scenery, environmental context, or additional background elements.
    keywords:
      - tree
      - flower
      - cactus
      - mushroom
      - cloud
      - raindrop
      - snowflake
      - mountain
      - pond
      - waterfall
      - river
      - sun
      - moon
      - star
      - rainbow
      - leaf
      - grass
      - rock
      - stone
      - wave
      - volcano
      - island
    section_hints:
      - nature
      - sky
      - garden
      - outdoor
      - weather
    visual_template: >-
      a single iconic {readable}, standalone isolated central vignette with clean rounded contours, strictly zero horizon, zero landscape background
    negative_tokens:
      - full landscape
      - horizon line
      - background forest
      - mountain range
      - sky backdrop
      - ground plane
      - scenery

  musical_instruments:
    category_name: "Musical Instruments & Sound Toys"
    category_rule: >-
      Preserve the recognizable shape and essential structural characteristics of the musical instrument or sound toy.
      Simplify strings, keys, holes, controls, and other small components where necessary.
    keywords:
      - piano
      - trumpet
      - violin
      - tambourine
      - maraca
      - harmonica
      - drum
      - guitar
      - flute
      - xylophone
      - bell
      - harp
      - accordion
      - recorder
      - saxophone
      - tuba
      - banjo
      - ukulele
      - cello
      - clarinet
    section_hints:
      - musical
      - music
      - instrument
      - sound
    visual_template: >-
      a classic toddler {readable} musical instrument, three-quarter angle view displaying its simplified musical body (large keys, bold strings, or clean drum surface), wide open coloring zones
    negative_tokens:
      - sheet music
      - musical notes floating
      - musician
      - hands playing
      - stage
      - intricate frets
      - micro-screws

  paired_items:
    category_name: "Paired Items"
    category_rule: >-
      Show a matching pair placed neatly side-by-side with balanced open coloring surfaces.
    keywords:
      - shoes
      - socks
      - boots
      - gloves
      - mittens
      - maracas
      - chopsticks
      - slippers
      - earrings
      - flip_flops
    section_hints: []
    visual_template: >-
      a cute matching pair of toddler {readable} placed neatly side-by-side with wide open coloring surfaces
    negative_tokens:
      - single shoe
      - single sock
      - feet
      - floor

  # State-dependent items are resolved by the engine before category matching.
  state_dependent:
    items:
      book:
        visual_template: >-
          a wide open toddler storybook with large clean blank colorable pages and a simple bookmark ribbon
      umbrella:
        visual_template: >-
          an open round canopy umbrella with distinct colorable stripe sections and a clean curved J-handle
      sunglasses:
        visual_template: >-
          a pair of cute toddler sunglasses, front view, round bold frames, and clean lenses
      glasses:
        visual_template: >-
          a pair of cute toddler sunglasses, front view, round bold frames, and clean lenses
      chair:
        visual_template: >-
          a classic toddler wooden chair, three-quarter view displaying its sturdy legs, backrest, smooth surface, and cozy preschool proportions
      table:
        visual_template: >-
          a classic toddler wooden table, three-quarter view displaying its sturdy four legs, smooth flat tabletop, and cozy preschool proportions
      crib:
        visual_template: >-
          a classic toddler crib, three-quarter view displaying its sturdy corner posts, smooth safety rails, and cozy preschool proportions

  # Fallback — used when nothing else matches
  fallback:
    category_name: "General Objects"
    category_rule: >-
      Preserve the iconic simplified physical silhouette with wide open coloring zones and clear contours.
    visual_template: >-
      a single {readable}, clear three-quarter or frontal view displaying its most iconic, authentic simplified physical silhouette with wide open coloring zones
    negative_tokens:
      - background scenery
      - floor
      - text
      - shading

# ---------------------------------------------------------------------------
# ANIMAL LOCOMOTION & ANATOMY MATRIX (Authoritative Standard)
# ---------------------------------------------------------------------------
animal_locomotion_matrix:
  quadrupeds:
    locomotion_type: "quadrupedal_walking"
    limb_count: 4
    default_posture: "natural quadrupedal standing posture, standing securely on all four legs with all four paws supporting the body"
    default_orientation: "three-quarter front view showing the complete body and limbs"
    safeguards: "Head and neck positioned naturally relative to the body. Do not stand upright on the hind legs. Do not use a human-like standing posture. Do not anthropomorphize the body."
    negative_tokens:
      - "standing on two legs"
      - "upright on hind legs"
      - "bipedal stance"
      - "human-like posture"
      - "human arms"
      - "human hands"
      - "human feet"
      - "sitting like a human"
      - "anthropomorphic body"

  bipeds:
    locomotion_type: "bipedal_walking"
    limb_count: 2
    default_posture: "natural bird standing posture on two legs, standing balanced on both feet"
    default_orientation: "three-quarter view showing both feet supporting the body"
    safeguards: "Head and neck positioned naturally. Do not use four legs. Do not give human arms or hands. Do not anthropomorphize the bird."
    negative_tokens:
      - "four legs"
      - "quadrupedal stance"
      - "human arms"
      - "human hands"
      - "human feet"
      - "human shoes"
      - "anthropomorphic body"

  aquatic:
    locomotion_type: "swimming"
    limb_count: 0
    default_posture: "natural horizontal streamlined swimming posture"
    default_orientation: "side-facing swimming profile"
    safeguards: "Fins and tail positioned naturally. Do not draw legs, feet, or terrestrial ground."
    negative_tokens:
      - "legs"
      - "feet"
      - "paws"
      - "standing on ground"
      - "walking upright"
      - "terrestrial walking"

  amphibians:
    locomotion_type: "crouching_hopping"
    limb_count: 4
    default_posture: "natural low-to-ground crouching posture with folded hind legs and front paws grounded"
    default_orientation: "three-quarter front view"
    safeguards: "Do not stand upright like a human. Do not give human hands or clothing."
    negative_tokens:
      - "standing upright"
      - "bipedal stance"
      - "human arms"
      - "human hands"
      - "human legs"

  invertebrates:
    locomotion_type: "crawling"
    limb_count: 0
    default_posture: "natural low-to-ground crawling posture with shell balanced naturally"
    default_orientation: "side profile view"
    safeguards: "Do not draw legs, arms, or human features."
    negative_tokens:
      - "legs"
      - "feet"
      - "paws"
      - "human arms"
      - "human hands"

  insects:
    locomotion_type: "flying_perching"
    limb_count: 6
    default_posture: "natural resting or flying posture with symmetrical wings"
    default_orientation: "balanced view showing complete wing silhouette"
    safeguards: "Do not draw human arms, hands, shoes, or cartoon mascot clothes."
    negative_tokens:
      - "human arms"
      - "human hands"
      - "human shoes"
      - "anthropomorphic clothing"

  arboreal:
    locomotion_type: "climbing_quadrupedal"
    limb_count: 4
    default_posture: "natural species-appropriate four-limbed posture or seated natural posture on all fours"
    default_orientation: "three-quarter front view"
    safeguards: "Do not stand upright like a human child. Do not give human feet or clothing."
    negative_tokens:
      - "standing upright on two legs"
      - "human standing posture"
      - "bipedal stance"
      - "human clothes"
      - "shoes"

