# ---------------------------------------------------------------------------
# UNIVERSAL PAGE ARCHETYPES
# Decouples page prompt generation from Python conditionals.
# Enables instant creation of new book formats (Mandalas, Dots, Tracing, Habitats).
# ---------------------------------------------------------------------------
page_archetypes:
  integrated_habitat:
    archetype_id: "integrated_habitat"
    description: "Living subject seamlessly embedded in natural environment with stroke hierarchy (4pt subject silhouette, 2pt habitat elements)."
    entity_policy: "always_living"
    requires_living_eyes: true
    requires_background_environment: true
    margin_reserve: "20% empty white margin at top for title typography"

  single_centered_subject:
    archetype_id: "single_centered_subject"
    description: "Single isolated subject centered on pure white canvas, 5pt contour, zero scenery."
    entity_policy: "semantic_domain"
    requires_living_eyes: false
    requires_background_environment: false

  geometric_pattern:
    archetype_id: "geometric_pattern"
    description: "Pure abstract geometric coloring line art (waves, concentric circles, mandalas, tessellations)."
    entity_policy: "strictly_abstract"
    requires_living_eyes: false
    requires_background_environment: false
    negative_tokens:
      - "faces"
      - "eyes"
      - "mouth"
      - "head"
      - "body"
      - "animals"
      - "characters"
      - "people"
      - "text"
      - "letters"
      - "numbers"
      - "words"

  connect_the_dots:
    archetype_id: "connect_the_dots"
    description: "Numbered guide dots (1, 2, 3...) connected by faint dotted guideline contours forming a hidden shape."
    entity_policy: "activity_puzzle"
    requires_living_eyes: false
    requires_background_environment: false
    negative_tokens:
      - "solid line art"
      - "colored lines"
      - "shading"
      - "pre-drawn dark outline"
      - "text paragraphs"

  tracing_handwriting:
    archetype_id: "tracing_handwriting"
    description: "Primary 3-line ruling guidelines with hollow letterforms containing centered directional dotted stroke tracing paths."
    entity_policy: "educational_handwriting"
    requires_living_eyes: false
    requires_background_environment: false
    negative_tokens:
      - "solid filled letters"
      - "black letters"
      - "solid black typography"
      - "shading"
      - "curved wavy lines"

  multi_card_spread:
    archetype_id: "multi_card_spread"
    description: "Uniform grid of N flashcard containers with bubble glyph on left and line art on right."
    entity_policy: "spread_grid"
    requires_living_eyes: false
    requires_background_environment: false


