# =============================================================================
# CurioKraft Kids — Taxonomy Configuration
# =============================================================================
# ALL category keyword sets and visual prompt templates live here.
# The debate engine reads this file at startup — ZERO hardcoded keywords in code.
# To support a new Volume or new object category: edit this file, touch no code.
# =============================================================================

# ---------------------------------------------------------------------------
# LIVING TAXONOMY
# ---------------------------------------------------------------------------

# Objects whose canonical_object name LOOKS like a living being but is NOT.
# These are checked FIRST — if matched, is_living = False regardless of name.
inanimate_exceptions:
  - rocking_horse
  - toy_robot
  - horse_shoe
  - butterfly_net
  - piggy_bank
  - dragonfly_kite
  - hobby_horse
  - stuffed_animal
  - rubber_duck
  - wind_up_toy

# Any token in canonical_object or section that signals a living being.
# The engine tokenizes the string and checks for intersection with this list.
living_keywords:
  - animal
  - creature
  - pet
  - insect
  - bug
  - bird
  - fish
  - dinosaur
  - reptile
  - mammal
  - dog
