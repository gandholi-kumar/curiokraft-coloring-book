      fallback_to_border: false
      border_margin_ratio: 0.18
    cards:
      contour_style: sinusoidal
      contour_params:
        amplitude: 7.0
        frequency: 0.035
        scallop_radius: 14.0
        scallop_depth: 6.0
        chamfer: 16.0
      fill_color:
      - 255
      - 255
      - 255
      - 255
      border_color:
      - 20
      - 24
      - 33
      - 255
      border_width: 5
      shadow: true
      shadow_offset:
      - 4
      - 5
      shadow_color:
      - 0
      - 0
      - 0
      - 35
      shadow_blur: 6
    text:
      welcome:
        header_title: "\u2605 CURIOKRAFT EXPEDITIONS \u2605"
        main_title: MY OCEAN EXPLORER LOGBOOK
        subtitle: A COLORING EXPEDITION INTO THE DEEP SEA
        name_prompt: 'THIS LOGBOOK BELONGS TO:'
        guide_title: "\u2605 OCEAN EXPLORER GUIDE \u2605"
